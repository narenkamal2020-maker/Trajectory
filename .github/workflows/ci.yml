name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: ci_admin_pw
          APP_USER: trajectory
          APP_USER_PASSWORD: ci_app_pw
        ports: ["1521:1521"]
        options: >-
          --shm-size=1g
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 15s
          --health-retries 25
          --health-start-period 180s
    env:
      NODE_ENV: test
      ORACLE_USER: trajectory
      ORACLE_PASSWORD: ci_app_pw
      ORACLE_CONNECTION_STRING: localhost:1521/XEPDB1
      JWT_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
      FRONTEND_URL: http://localhost:5173
      PYTHON_BIN: python3
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt
      - run: python train.py
      - run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web, ml]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trajectory-api .
      - run: docker build -t trajectory-ml ./ml
