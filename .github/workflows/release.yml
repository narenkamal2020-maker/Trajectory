name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:

# ── Create release first (eliminates parallel-create race condition) ───────────
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Trajectory ${{ github.ref_name }}" \
            --generate-notes \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
            || echo "Release already exists, continuing"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ── Desktop: Windows ──────────────────────────────────────────────────────────
  desktop-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: desktop
      - name: Build Windows installer
        run: npm run dist
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" desktop/dist/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ── Desktop: macOS ────────────────────────────────────────────────────────────
  desktop-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: desktop
      - name: Build macOS disk image
        run: npm run dist
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" desktop/dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ── Desktop: Linux ────────────────────────────────────────────────────────────
  desktop-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: desktop
      - name: Build Linux packages
        run: npm run dist
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to release
        run: |
          gh release upload "${{ github.ref_name }}" desktop/dist/*.AppImage --clobber || true
          gh release upload "${{ github.ref_name }}" desktop/dist/*.deb --clobber || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ── Android ───────────────────────────────────────────────────────────────────
  android:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install web app deps
        run: npm ci
        working-directory: app
      - name: Build web + sync to Android
        run: npm run cap:sync
        working-directory: app
      - name: Decode keystore (if secret is set)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload to release
        run: |
          TAG="${{ github.ref_name }}"
          APK=$(find app/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "trajectory-android-${TAG}.apk"
          gh release upload "$TAG" "trajectory-android-${TAG}.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ── Finalise release body ─────────────────────────────────────────────────────
  finalise:
    needs: [desktop-windows, desktop-macos, desktop-linux, android]
    runs-on: ubuntu-latest
    steps:
      - name: Add download table to release
        run: |
          gh release edit "${{ github.ref_name }}" --notes "$(cat <<'BODY'
          ## Trajectory ${{ github.ref_name }}

          ### Downloads
          | Platform | File | Notes |
          |----------|------|-------|
          | Windows  | `Trajectory Setup *.exe` | NSIS installer — Windows 10 (64-bit) or later |
          | macOS    | `Trajectory-*.dmg` | Disk image — macOS 11 Big Sur or later |
          | Linux    | `Trajectory-*.AppImage` / `*.deb` | AppImage or Debian package |
          | Android  | `trajectory-android-*.apk` | Sideload — Android 7.0+ |
          | iOS      | App Store / TestFlight — see website | |

          ### Install notes
          - **Windows:** If SmartScreen warns, click "More info" → "Run anyway".
          - **macOS:** Drag to Applications. If Gatekeeper blocks, open System Settings → Privacy & Security → Open Anyway.
          - **Linux (AppImage):** `chmod +x Trajectory-*.AppImage && ./Trajectory-*.AppImage`
          - **Android:** Enable "Install unknown apps" in Settings when prompted.
          BODY
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
